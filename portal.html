<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Portal</title>
<style>
  :root{--bg:#f3f5f8;--fg:#1f2937;--muted:#6b7280;--line:#e5e7eb;--navy:#1f3a5f;--blue:#2563eb;--ok:#16a34a;--off:#9ca3af;--chip:#eef2f7}
  *{box-sizing:border-box}body{font:14px/1.5 -apple-system,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px}
  .logo{font-weight:800;color:var(--navy);font-size:16px}.logo small{font-weight:500;color:var(--muted);font-size:11px;margin-left:6px}
  .top .sp{flex:1}.user{font-size:12px;color:var(--muted)}
  .wrap{display:grid;grid-template-columns:200px 1fr 300px;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
  @media(max-width:1100px){.wrap{grid-template-columns:180px 1fr}.right{grid-column:1/-1}}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}.side{display:none}}
  .side{display:flex;flex-direction:column;gap:12px}
  .mk{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
  .menu{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}.menu div{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}.menu div.on{background:var(--chip);color:var(--navy);font-weight:600}
  .box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.box h4{margin:0 0 8px;font-size:12px;color:var(--muted)}.box table{width:100%;font-size:12px;border-collapse:collapse}.box td{padding:3px 0}.box td:last-child{text-align:right;font-weight:600}
  .search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;align-items:center}.search input{flex:1;border:none;font:inherit;outline:none}.search span{font-size:11px;color:var(--muted)}
  .chips{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;background:#fff;cursor:pointer;color:var(--muted)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  h2{font-size:15px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.col h3{font-size:12px;color:var(--navy);margin:0 0 6px;display:flex;align-items:center;gap:6px}
  .mini{display:flex;gap:10px;padding:8px 4px;border-top:1px solid #f1f3f6;cursor:pointer;align-items:flex-start}.mini:first-of-type{border-top:none}.mini .ic{width:34px;height:34px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .mini b{font-size:13px;display:block}.mini .d{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mini .s{font-size:10px;color:var(--muted);margin-top:3px}
  .rank{font-size:11px;color:var(--muted);width:14px;padding-top:9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px}
  .title{font-weight:700;font-size:15px;line-height:1.35;display:flex;gap:6px;align-items:flex-start}.new{font-size:10px;border:1px solid #d97706;color:#b45309;border-radius:4px;padding:0 5px;line-height:16px;white-space:nowrap;margin-top:3px}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.status i{width:7px;height:7px;border-radius:50%;background:var(--off);display:inline-block}.up .status i{background:var(--ok)}
  .desc{font-size:12.5px;color:#4b5563;min-height:3em}.who{font-size:12px;color:var(--muted)}.who b{color:var(--fg);font-weight:500}
  .tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:11px;color:var(--blue)}
  .stat{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.stat .h{margin-left:auto;cursor:pointer;color:#e11d48}
  .btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line);font-weight:500}.btns{display:flex;gap:6px}.btns .btn{flex:1}
  .missing{opacity:.55}
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}.sort{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.sort button{border:none;background:#fff;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}.sort button.on{background:var(--navy);color:#fff}
  .feed{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.feed h3{margin:0 0 10px;font-size:14px}.post{border-top:1px solid #f1f3f6;padding:10px 0}.post b{font-size:13px}.post p{margin:4px 0;font-size:12px;color:#4b5563}.post .m{font-size:11px;color:var(--muted);display:flex;gap:8px}.post .m .l{color:#e11d48;margin-left:auto}
  dialog{border:1px solid var(--line);border-radius:10px;max-width:760px;width:90%;padding:0}dialog pre{white-space:pre-wrap;font-size:12.5px;padding:18px;margin:0;max-height:70vh;overflow:auto}dialog .x{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
</style>
<div class="top"><span class="logo">KAERI AI Agent Portal<small>내부망 로컬 LLM 에이전트</small></span><span class="sp"></span><span class="user" id="user"></span></div>
<div class="wrap">
  <aside class="side">
    <button class="mk" onclick="howto('','내 에이전트 만들기')">+ 내 에이전트 만들기</button>
    <div class="menu" id="menu"><div data-v="home" class="on">홈</div><div data-v="all">전체 에이전트</div><div data-v="fav">즐겨찾기</div><div data-v="recent">최근 사용</div></div>
    <div class="box"><h4>현황</h4><table id="counts"></table></div>
    <div class="box"><h4>사용자 랭킹 (최근 30일)</h4><table id="rank"></table></div>
  </aside>
  <main>
    <div class="search"><span>🔍</span><input id="q" placeholder="원하는 작업을 입력하세요 (예: 회의록, HWP, 그림)"><span>Enter</span></div>
    <div class="chips" id="chips"></div>
    <div id="home">
      <h2>추천 에이전트 <small>사용량·좋아요 기준</small></h2>
      <div class="cols" id="cols"></div>
      <h2>최근 추가 <small>30일 이내</small></h2>
      <div class="cols" id="newcols"></div>
    </div>
    <div id="all" hidden>
      <div class="hd"><div><h2 style="margin:0">전체 에이전트</h2><div style="font-size:12px;color:var(--muted)" id="count"></div></div>
        <div class="sort"><button data-s="pop" class="on">인기순</button><button data-s="name">이름순</button><button data-s="new">최신순</button></div></div>
      <div class="grid" id="grid" style="margin-top:12px"></div>
    </div>
  </main>
  <aside class="right"><div class="feed"><h3>📌 노하우 · 우수사례 피드</h3><div id="feed"></div></div></aside>
</div>
<dialog id="dlg"><div class="x"><span id="dlgT"></span><button onclick="dlg.close()" style="border:none;background:none;font-size:18px;cursor:pointer">×</button></div><pre id="dlgB"></pre></dialog>
<script>
let TOOLS=[],FEED=[],view='home',sort='pop',cat='전체',query='';
const ICON={문서:'📄',회의:'🎙️',그림:'🎨',음성:'🔊',데이터:'📊',재미:'🎲'};
const LS=k=>JSON.parse(localStorage.getItem(k)||'[]'),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const isNew=t=>(Date.now()-new Date(t.added))/864e5<=30;
const score=t=>t.usage.recent*3+t.usage.likes*2+t.usage.total;
function filtered(){let ts=TOOLS.filter(t=>cat==='전체'||t.group===cat);if(query)ts=ts.filter(t=>(t.title+t.desc+t.tags.join()).toLowerCase().includes(query));
  if(view==='fav'){const f=LS('fav');ts=ts.filter(t=>f.includes(t.dir))}if(view==='recent'){const r=LS('recent');ts=ts.filter(t=>r.includes(t.dir)).sort((a,b)=>r.indexOf(a.dir)-r.indexOf(b.dir))}return ts}
function mini(t,i){return `<div class="mini" onclick="go('${t.dir}')"><span class="rank">${i}</span><div class="ic">${ICON[t.group]||'🤖'}</div><div><b>${t.title.split(' — ')[0]}</b><div class="d">${t.desc}</div><div class="s">${t.up?'🟢 실행 중':'⚪ 중지'} · 👁 ${t.usage.total} · ❤ ${t.usage.likes}</div></div></div>`}
function render(){
  const ts=filtered();
  chips.innerHTML=['전체',...new Set(TOOLS.map(t=>t.group))].map(c=>`<span class="chip ${c===cat?'on':''}" onclick="cat='${c}';render()">${c}</span>`).join('');
  home.hidden=view!=='home';all.hidden=view==='home';
  if(view==='home'){const r=[...ts].sort((a,b)=>score(b)-score(a));
    cols.innerHTML=[[0,3],[3,6],[6,9]].map(([a,b])=>`<div class="col"><h3>🏆 인기 에이전트 TOP ${a+1}-${b}</h3>${r.slice(a,b).map((t,i)=>mini(t,a+i+1)).join('')||'<div class="d" style="font-size:12px;color:#999">없음</div>'}</div>`).join('');
    const n=ts.filter(isNew).sort((a,b)=>b.added.localeCompare(a.added));
    newcols.innerHTML=`<div class="col"><h3>✨ 신규 에이전트</h3>${n.slice(0,6).map((t,i)=>mini(t,i+1)).join('')}</div><div class="col"><h3>🕒 최근 사용</h3>${LS('recent').map(d=>TOOLS.find(t=>t.dir===d)).filter(Boolean).slice(0,6).map((t,i)=>mini(t,i+1)).join('')||'<div style="font-size:12px;color:#999">아직 없음</div>'}</div>`;
  } else {
    ts.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title,'ko'):sort==='new'?b.added.localeCompare(a.added):score(b)-score(a));
    count.textContent=`전체 ${TOOLS.length}개 중 ${ts.length}개 표시`;const fav=LS('fav');
    grid.innerHTML=ts.map(t=>`<div class="card ${t.up?'up':''} ${t.installed?'':'missing'}">
      <div class="title"><span>${t.title}</span>${isNew(t)?'<span class="new">신규</span>':''}</div>
      <div class="status"><i></i>${t.installed?(t.up?'실행 중':'중지됨'):'미설치'}</div><div class="desc">${t.desc}</div>
      <div class="who">${t.dept} · <b>${t.author}</b></div><div class="tags">${t.tags.map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="stat"><span>최근 30일 <b>${t.usage.recent}회</b></span>·<span>누적 ${t.usage.total}회</span>·<span>사용자 ${t.usage.users}명</span><span class="h" onclick="like('${t.dir}')">❤ ${t.usage.likes}</span><span style="cursor:pointer" onclick="fav('${t.dir}')">${fav.includes(t.dir)?'★':'☆'}</span></div>
      ${t.up?`<a class="btn" href="${t.url}" target="_blank" onclick="hit('${t.dir}')">열기</a>`:`<div class="btns"><button class="btn ghost" onclick="howto('${t.dir}','${t.title.replace(/'/g,'')}')">실행 방법 보기</button>${t.installed?`<button class="btn" onclick="act('start','${t.dir}')">시작</button>`:''}</div>`}
    </div>`).join('');
  }
  counts.innerHTML=[['전체',TOOLS.length],['실행 중',TOOLS.filter(t=>t.up).length],['신규(30일)',TOOLS.filter(isNew).length],['미설치',TOOLS.filter(t=>!t.installed).length]].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  rank.innerHTML=[...TOOLS].sort((a,b)=>b.usage.recent-a.usage.recent).slice(0,5).map((t,i)=>`<tr><td>${i+1}. ${t.title.split(' — ')[0]}</td><td>${t.usage.recent}</td></tr>`).join('');
  feed.innerHTML=FEED.map(p=>`<div class="post"><b>${p.title}</b><p>${p.body}</p><div class="m"><span>${p.dept}</span><span>${p.author}</span><span>${p.date}</span><span class="l">❤ ${p.likes}</span></div></div>`).join('');
}
function go(d){const t=TOOLS.find(x=>x.dir===d);if(t.up){hit(d);window.open(t.url)}else howto(d,t.title)}
function hit(d){save('recent',[d,...LS('recent').filter(x=>x!==d)].slice(0,10));fetch('/api/open',{method:'POST',body:JSON.stringify({dir:d})}).then(()=>setTimeout(load,500))}
function like(d){fetch('/api/like',{method:'POST',body:JSON.stringify({dir:d})}).then(()=>setTimeout(load,300))}
function fav(d){const f=LS('fav');save('fav',f.includes(d)?f.filter(x=>x!==d):[...f,d]);render()}
async function act(a,d){await fetch('/api/'+a,{method:'POST',body:JSON.stringify({dir:d})});setTimeout(load,4000);setTimeout(load,15000)}
async function howto(d,title){dlgT.textContent=title;dlgB.textContent=d?await fetch('/api/readme/'+d).then(r=>r.text()):'새 에이전트 추가 방법\n\n1. agent_page/ 아래 <이름>-local/ 폴더를 만든다 (app.py · ui.html · setup.sh · selftest.py · README.md)\n2. LLM 연결은 환경변수 LLM_API / LLM_BASE_URL / LLM_MODEL 규약을 따른다\n3. portal/tools.json 에 한 줄 추가 (dir, port, title, desc, group, tags, dept, author, added)\n4. 포털 새로고침';dlg.showModal()}
async function load(){[TOOLS,FEED]=await Promise.all([fetch('/api/tools').then(r=>r.json()),fetch('/api/feed').then(r=>r.json())]);render()}
menu.querySelectorAll('div').forEach(m=>m.onclick=()=>{menu.querySelectorAll('div').forEach(x=>x.classList.remove('on'));m.classList.add('on');view=m.dataset.v;if(view==='fav'||view==='recent'){view==='fav'?(view='fav'):(view='recent');all.hidden=false}render()});
document.querySelectorAll('.sort button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sort button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sort=b.dataset.s;render()});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){query=e.target.value.trim().toLowerCase();if(view==='home'){view='all';menu.querySelectorAll('div').forEach(x=>x.classList.toggle('on',x.dataset.v==='all'))}render()}});
document.getElementById('user').textContent='내부망 · '+location.hostname;
if(location.hash==='#all'){view='all';menu.querySelectorAll('div').forEach(x=>x.classList.toggle('on',x.dataset.v==='all'))}  // 딥링크
load();setInterval(load,10000);
</script>
