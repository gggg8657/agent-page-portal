<section class="tool" id="tts-local">

    <div><div class="frame inbox">안녕하세요, 인공지능응용연구실 김동주입니다. 다음 주 화요일 오후 두 시에 자료 정리 교육이 있습니다.</div><div class="cap">읽을 글</div></div>

  </div>
