<section class="tool" id="sketch-local">
  <p class="cat">그림</p>
  <h2>Sketch</h2>
  <p>손그림 사진을 올리면 구조를 읽어 논문 스타일 다이어그램으로 다시 그립니다.</p>
  <div class="strip s2">
    <div><div class="frame"><img src="img/sketch-local-in.png" alt="설문 응답 분석 흐름 손그림"></div><div class="cap">손그림 사진</div></div>
    <div class="arr">→</div>
    <div><div class="frame"><img src="img/sketch-local-result.png" alt="정돈된 다이어그램"></div><div class="cap">논문 스타일 다이어그램</div></div>
  </div>
  <div class="steps">
    <div class="two">
      <div class="step"><div class="t"><span class="n">1</span><p>손그림 사진을 올리고 <b>1. 읽기</b>를 누릅니다.</p></div><div class="frame"><img src="img/sketch-local-s1.png" alt=""></div></div>
      <div class="step"><div class="t"><span class="n">2</span><p>읽은 글자와 연결을 확인해 틀린 곳을 고치고 <b>2. 확인 → 방향 정하기</b>를 누릅니다.</p></div><div class="frame"><img src="img/sketch-local-s2.png" alt=""></div></div>
    </div>
    <div class="step"><div class="t"><span class="n">3</span><p><b>원본 그대로 재현</b> 같은 그리는 방식을 고르면 스타일과 유형을 추천해 줍니다. 필요하면 바꾸고 <b>4. 그리기</b>를 누릅니다.</p></div><div class="frame"><img src="img/sketch-local-s3.png" alt=""></div></div>
    <div class="step"><div class="t"><span class="n">4</span><p><b>SVG</b>나 <b>PNG</b>로 내려받습니다.</p></div><div class="frame"><img src="img/sketch-local-s4.png" alt=""></div></div>
  </div>
</section>
